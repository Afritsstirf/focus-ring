<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Ring</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Focus Ring</h1>
      <div class="streak" id="streak">🔥 0 day streak</div>
    </header>

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-btn active" data-mode="focus">Focus</button>
      <button class="mode-btn" data-mode="short">Short Break</button>
      <button class="mode-btn" data-mode="long">Long Break</button>
    </div>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 300 300">
        <circle class="ring-bg" cx="150" cy="150" r="130"></circle>
        <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="130"></circle>
      </svg>
      <div class="ring-center">
        <div class="time" id="timeDisplay">25:00</div>
        <div class="session-count" id="sessionCount">Session 1</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn secondary" id="resetBtn" title="Reset">↺</button>
      <button class="btn primary" id="startBtn">Start</button>
      <button class="btn secondary" id="skipBtn" title="Skip">⏭</button>
    </div>

    <div class="settings">
      <label>Focus
        <input type="number" id="focusMin" min="1" max="90" value="25" />
      </label>
      <label>Short
        <input type="number" id="shortMin" min="1" max="30" value="5" />
      </label>
      <label>Long
        <input type="number" id="longMin" min="1" max="60" value="15" />
      </label>
    </div>

    <div class="log-section">
      <div class="log-header">
        <h2>Today's Sessions</h2>
        <button class="btn text" id="clearLogBtn">Clear</button>
      </div>
      <ul class="log-list" id="logList"></ul>
    </div>
  </div>

  <audio id="chime" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
